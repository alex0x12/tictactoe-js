<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-нолики N x N</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Крестики-нолики</h1>
  </header>

  <main class="layout">
    <!-- Слева: параметры партии -->
    <section class="panel params" aria-label="Параметры партии">
      <h2>Параметры</h2>

      <label for="size">Размер поля N: <output id="size-value">3</output></label>
      <input type="range" id="size" min="3" max="15" step="1" value="3">

      <label for="win">Цепочка K: <output id="win-value">3</output></label>
      <input type="range" id="win" min="3" max="3" step="1" value="3">

      <fieldset>
        <legend>Режим</legend>
        <label><input type="radio" name="mode" value="pvp" checked> Два игрока</label>
        <label><input type="radio" name="mode" value="ai"> Против ИИ</label>
        <label><input type="radio" name="mode" value="online"> По сети</label>
      </fieldset>

      <fieldset class="ai-only" disabled>
        <legend>Сложность</legend>
        <label><input type="radio" name="difficulty" value="easy"> Лёгкий</label>
        <label><input type="radio" name="difficulty" value="medium" checked> Средний</label>
        <label><input type="radio" name="difficulty" value="hard"> Сложный</label>
      </fieldset>

      <fieldset class="ai-only" disabled>
        <legend>Кто ходит первым</legend>
        <label><input type="radio" name="first" value="human" checked> Вы</label>
        <label><input type="radio" name="first" value="ai"> ИИ</label>
      </fieldset>

      <!-- Режим "По сети": форма входа, пока игрок не вошёл, потом его данные и кнопки -->
      <fieldset class="online-only" hidden>
        <legend>Игра по сети</legend>

        <form class="login-form">
          <label>Никнейм <input name="nickname" autocomplete="username" required></label>
          <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit" value="login">Войти</button>
          <button type="submit" value="register">Регистрация</button>
        </form>

        <div class="account" hidden>
          <p>Вы: <b class="nickname"></b> <button type="button" class="btn-logout">Выйти</button></p>
          <p class="stats"></p>
          <button type="button" class="btn-random">Случайный соперник</button>
          <button type="button" class="btn-invite">Пригласить друга</button>
          <label class="invite" hidden>Ссылка для друга <input class="invite-link" readonly></label>
          <h3>Мои партии</h3>
          <ul class="my-games"></ul>
        </div>

        <p class="online-error" role="alert"></p>
      </fieldset>

    </section>

    <!-- В центре: поле -->
    <section class="board-area">
      <div id="board" class="board" role="grid" aria-label="Игровое поле"></div>

      <!-- Полоса повтора партии, видна только во время повтора -->
      <div class="replay" hidden>
        <button type="button" class="btn-back">Назад</button>
        <button type="button" class="btn-play">Пуск</button>
        <button type="button" class="btn-forward">Вперёд</button>
        <span class="replay-step"></span>
        <button type="button" class="btn-close">Закрыть</button>
      </div>
    </section>

    <!-- Справа: статус и управление -->
    <aside id="status" class="panel status" aria-label="Статус партии">
      <h2>Статус</h2>
      <p class="turn">Ход: ✕</p>
      <p class="moves">Сделано ходов: 0</p>

      <div class="controls">
        <button type="button" class="btn-undo">⟲ Отменить ход</button>
        <button type="button" class="btn-redo">⟳ Вернуть</button>
        <button type="button" class="btn-new">⏻ Новая партия</button>
        <button type="button" class="btn-resign">⚑ Сдаться</button>
      </div>
      <p class="score"></p>

      <h2>Рейтинг</h2>
      <table class="leaderboard" hidden>
        <thead><tr><th>Игрок</th><th>П</th><th>Н</th><th>Пр</th><th>Очки</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="leaderboard-note"></p>
    </aside>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
